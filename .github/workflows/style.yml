name: Style

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Superseded PR runs are cancelled: a newer push to the same PR stops the
# in-flight run for the older commit. Every non-PR event (push to the default
# branch, schedule, dispatch) is grouped by its own commit sha, so it is never
# cancelled and never queued behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Check code formatting with Black
      run: |
        black --check  --diff .

    - name: Lint with flake8
      run: |
        flake8 .
